services:
  - type: web
    name: result
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    plan: free
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: result-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.13.0

databases:
  - name: result-db
    plan: free

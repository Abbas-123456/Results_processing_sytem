services:
  - type: web
    name: result
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "python manage.py create_superuser && gunicorn core.wsgi:application"
    plan: free
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: result-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_PASSWORD
        value: admin123
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com

databases:
  - name: result-db
    plan: free

services:
  - type: web
    name: result
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn core.wsgi:application"
    plan: free
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DJANGO_DEBUG
        value: "false"
